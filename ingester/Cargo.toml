[package]
name = "backlink-ingest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "backlink-ingest"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.3"
polars = { version = "0.46", features = ["parquet", "lazy", "dtype-datetime"] }
chrono = "0.4"
url = "2"
anyhow = "1"
rayon = "1.10"
glob = "0.3"

[profile.release]
opt-level = 3
lto = true
